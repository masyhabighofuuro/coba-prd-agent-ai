{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h1 class="h4 mb-1 text-center">Catat Barang</h1>
        <p class="text-muted text-center mb-4">Masuk dengan akun bersama tim</p>

        <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 btn-lg">Masuk</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
